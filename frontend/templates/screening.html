<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="logo"><span class="logo-mark">🧠</span><span>MindGuard</span></div>
    <nav>
      <a href="/">首页</a>
      <a href="/assessment">测评中心</a>
      <a href="/my-records">我的档案</a>
      <a href="/resources">心理资源</a>
    </nav>
  </header>

  <div class="container">
    <section class="hero">
      <div class="hero-content">
        <div class="eyebrow">📋 经典量表 · PHQ-9 + GAD-7</div>
        <h1>回答 16 道题，<br>大约 3 分钟</h1>
        <p class="sub">采用业界最常用的两个经典自评量表：<br>
          <strong style="color:#2DD4BF">PHQ-9</strong>（抑郁 9 题）+ <strong style="color:#818CF8">GAD-7</strong>（焦虑 7 题）。<br>
          答案没有对错，选一个最贴近你最近两周感受的选项就好。</p>
      </div>
    </section>

    <!-- 进度条 -->
    <div style="margin-top:28px;margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;font-size:13px;color:#94A3B8;margin-bottom:8px">
        <span>进度</span><span id="progressText">0 / 16</span>
      </div>
      <div style="height:6px;background:rgba(255,255,255,0.06);border-radius:100px;overflow:hidden">
        <div id="progressBar" style="height:100%;width:0%;background:linear-gradient(90deg,#2DD4BF,#818CF8);border-radius:100px;transition:width .3s"></div>
      </div>
    </div>

    <!-- 题目区 -->
    <section id="quizArea">
      <div class="card" style="padding:36px">
        <div style="display:flex;gap:8px;margin-bottom:14px">
          <span id="quizTag" style="font-size:11px;padding:3px 10px;border-radius:100px;background:rgba(45,212,191,0.12);color:#2DD4BF;font-weight:600">PHQ-9 · 抑郁筛查</span>
        </div>
        <h3 id="quizQuestion" style="font-size:18px;color:#F8FAFC;margin:0 0 28px;line-height:1.6">加载中...</h3>
        <div id="quizOptions" style="display:flex;flex-direction:column;gap:10px"></div>
      </div>

      <div style="display:flex;justify-content:space-between;margin-top:20px">
        <button class="btn btn-ghost" id="btnPrev" onclick="prevQuestion()" disabled>← 上一题</button>
        <button class="btn btn-primary" id="btnNext" onclick="nextQuestion()">下一题 →</button>
      </div>
    </section>

    <!-- 结果区（默认隐藏） -->
    <section id="resultArea" style="display:none;margin-top:24px">
      <div class="card" style="padding:36px">
        <div style="text-align:center;margin-bottom:24px">
          <div id="resultEmoji" style="font-size:64px">📊</div>
          <h2 id="resultTitle" style="font-size:22px;color:#F8FAFC;margin:12px 0 6px">结果</h2>
          <div id="resultSub" style="color:#94A3B8;font-size:14px"></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px">
          <div style="background:rgba(45,212,191,0.08);padding:18px;border-radius:12px;text-align:center;border:1px solid rgba(45,212,191,0.2)">
            <div style="font-size:12px;color:#94A3B8;margin-bottom:4px">PHQ-9 抑郁</div>
            <div id="phqScore" style="font-size:32px;font-weight:700;color:#2DD4BF">0</div>
            <div id="phqLevel" style="font-size:12px;color:#94A3B8"></div>
          </div>
          <div style="background:rgba(129,140,248,0.08);padding:18px;border-radius:12px;text-align:center;border:1px solid rgba(129,140,248,0.2)">
            <div style="font-size:12px;color:#94A3B8;margin-bottom:4px">GAD-7 焦虑</div>
            <div id="gadScore" style="font-size:32px;font-weight:700;color:#818CF8">0</div>
            <div id="gadLevel" style="font-size:12px;color:#94A3B8"></div>
          </div>
        </div>
        <div id="resultAdvice" style="padding:16px 20px;background:rgba(251,191,36,0.06);border-left:3px solid #FBBF24;border-radius:8px;font-size:13px;color:#CBD5E1;line-height:1.8"></div>
        <div style="display:flex;gap:12px;margin-top:24px;justify-content:center;flex-wrap:wrap">
          <button class="btn btn-ghost" onclick="startQuiz()">🔄 重新测评</button>
          <a class="btn btn-primary" href="/adaptive">🧠 试试自适应测评</a>
        </div>
      </div>
    </section>
  </div>

  <script>
  const QUESTIONS = [
    {tag:'PHQ-9 · 抑郁', text:'做事时提不起劲或没有兴趣', scale:'phq'},
    {tag:'PHQ-9 · 抑郁', text:'感到心情低落、沮丧或绝望', scale:'phq'},
    {tag:'PHQ-9 · 抑郁', text:'入睡困难、睡不安稳或睡眠过多', scale:'phq'},
    {tag:'PHQ-9 · 抑郁', text:'感觉疲倦或没有活力', scale:'phq'},
    {tag:'PHQ-9 · 抑郁', text:'食欲不振或吃太多', scale:'phq'},
    {tag:'PHQ-9 · 抑郁', text:'觉得自己很糟或让家人失望', scale:'phq'},
    {tag:'PHQ-9 · 抑郁', text:'注意力难以集中（如读报纸或看电视）', scale:'phq'},
    {tag:'PHQ-9 · 抑郁', text:'动作或说话缓慢到已被他人察觉', scale:'phq'},
    {tag:'PHQ-9 · 抑郁', text:'有不如死掉或用某种方式伤害自己的念头', scale:'phq'},
    {tag:'GAD-7 · 焦虑', text:'感到紧张、焦虑或烦躁', scale:'gad'},
    {tag:'GAD-7 · 焦虑', text:'不能停止或控制担忧', scale:'gad'},
    {tag:'GAD-7 · 焦虑', text:'对各种事情过度担忧', scale:'gad'},
    {tag:'GAD-7 · 焦虑', text:'难以放松', scale:'gad'},
    {tag:'GAD-7 · 焦虑', text:'坐立不安、难以安静坐着', scale:'gad'},
    {tag:'GAD-7 · 焦虑', text:'容易烦恼或易怒', scale:'gad'},
    {tag:'GAD-7 · 焦虑', text:'害怕有可怕的事发生', scale:'gad'},
  ];
  const OPTIONS = [
    {v:0, label:'完全没有', hint:'过去两周未出现'},
    {v:1, label:'几天', hint:'过去两周 1-2 天'},
    {v:2, label:'一半以上天数', hint:'过去两周 3-4 天'},
    {v:3, label:'几乎每天', hint:'过去两周 ≥5 天'},
  ];
  let answers = new Array(QUESTIONS.length).fill(-1);
  let idx = 0;

  function startQuiz() {
    answers = new Array(QUESTIONS.length).fill(-1);
    idx = 0;
    document.getElementById('quizArea').style.display = 'block';
    document.getElementById('resultArea').style.display = 'none';
    render();
  }
  function render() {
    const q = QUESTIONS[idx];
    document.getElementById('quizTag').textContent = q.tag;
    document.getElementById('quizQuestion').textContent = 'Q' + (idx+1) + '. ' + q.text;
    document.getElementById('progressText').textContent = (idx+1) + ' / ' + QUESTIONS.length;
    document.getElementById('progressBar').style.width = ((idx+1)/QUESTIONS.length*100) + '%';
    document.getElementById('btnPrev').disabled = idx === 0;
    document.getElementById('btnNext').textContent = idx === QUESTIONS.length-1 ? '查看结果 ✨' : '下一题 →';
    const opts = OPTIONS.map(o => {
      const selected = answers[idx] === o.v;
      return '<div onclick="selectOption('+o.v+')" style="padding:14px 18px;border-radius:10px;border:2px solid '+(selected?'#2DD4BF':'rgba(255,255,255,0.08)')+';background:'+(selected?'rgba(45,212,191,0.1)':'rgba(255,255,255,0.02)')+';cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:.15s">'+
        '<div><strong style="color:#F8FAFC;font-size:14px">'+o.label+'</strong><div style="font-size:12px;color:#64748B">'+o.hint+'</div></div>'+
        '<div style="width:22px;height:22px;border-radius:50%;border:2px solid '+(selected?'#2DD4BF':'rgba(255,255,255,0.2)')+';background:'+(selected?'#2DD4BF':'transparent')+'"></div>'+
      '</div>';
    }).join('');
    document.getElementById('quizOptions').innerHTML = opts;
  }
  function selectOption(v) {
    answers[idx] = v;
    render();
  }
  function prevQuestion() {
    if (idx > 0) { idx--; render(); }
  }
  function nextQuestion() {
    if (answers[idx] === -1) { alert('请先选一个选项'); return; }
    if (idx < QUESTIONS.length - 1) { idx++; render(); }
    else showResult();
  }
  function showResult() {
    let phq = 0, gad = 0;
    answers.forEach((v, i) => {
      if (QUESTIONS[i].scale === 'phq') phq += v; else gad += v;
    });
    const levelOf = (s, t) => {
      if (t === 'phq') {
        if (s < 5) return {l:'正常', c:'#2DD4BF'};
        if (s < 10) return {l:'轻度', c:'#FBBF24'};
        if (s < 15) return {l:'中度', c:'#F97316'};
        if (s < 20) return {l:'中重度', c:'#EF4444'};
        return {l:'重度', c:'#DC2626'};
      } else {
        if (s < 5) return {l:'正常', c:'#2DD4BF'};
        if (s < 10) return {l:'轻度', c:'#FBBF24'};
        if (s < 15) return {l:'中度', c:'#F97316'};
        return {l:'重度', c:'#EF4444'};
      }
    };
    const phqL = levelOf(phq, 'phq');
    const gadL = levelOf(gad, 'gad');
    document.getElementById('phqScore').textContent = phq;
    document.getElementById('phqLevel').textContent = phqL.l + '风险 (' + phq + '/27)';
    document.getElementById('gadScore').textContent = gad;
    document.getElementById('gadLevel').textContent = gadL.l + '风险 (' + gad + '/21)';
    const maxScore = Math.max(phq, gad);
    const emoji = maxScore < 5 ? '😊' : maxScore < 10 ? '🙂' : maxScore < 15 ? '😟' : '😰';
    document.getElementById('resultEmoji').textContent = emoji;
    document.getElementById('resultTitle').textContent = '测评完成';
    document.getElementById('resultSub').textContent = 'PHQ-9 ' + phqL.l + ' · GAD-7 ' + gadL.l;
    let advice = '';
    if (maxScore < 5) advice = '✨ 你的心理状态良好，继续保持规律作息、适度运动和正向社交就好～';
    else if (maxScore < 10) advice = '💛 有一些轻度困扰，试试做 <a href="/breathing" style="color:#2DD4BF">呼吸训练</a> 和 <a href="/cbt" style="color:#2DD4BF">CBT 自助</a>，如果持续两周以上，建议找专业老师聊聊。';
    else if (maxScore < 15) advice = '🟠 中度困扰，建议联系学校心理老师预约咨询。同时可以试试 MindGuard 的 <a href="/cbt" style="color:#818CF8">认知扭曲检测</a> 工具。';
    else advice = '🔴 较高风险，建议尽快联系专业心理咨询，或拨打全国援助热线 400-161-9995。你不是一个人。';
    document.getElementById('resultAdvice').innerHTML = advice;
    document.getElementById('quizArea').style.display = 'none';
    document.getElementById('resultArea').style.display = 'block';
    // 保存到后端
    fetch('/api/features/save-screening', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({phq_score: phq, gad_score: gad})
    }).catch(()=>{});
  }
  startQuiz();
  </script>

  <footer>MindGuard · 神经符号心理健康风险智能筛查系统</footer>
  <script src="/static/js/app.js"></script>
</body>
</html>
