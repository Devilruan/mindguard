<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/static/css/app.css?v=4.6">
  <script src="/static/js/echarts.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="logo"><span class="logo-mark">🧠</span><span>MindGuard</span></div>
    <nav>
      <a href="/">首页</a>
      <a href="/assessment">测评中心</a>
      <a href="/my-records">我的档案</a>
      <a href="/resources">心理资源</a>
    </nav>
  </header>

  <div class="container">
    <section class="hero">
      <div class="hero-content">
        <div class="eyebrow">📁 匿名档案 · 本地存储</div>
        <h1>你的每一次测评，<br>都是在更好地了解自己</h1>
        <p class="sub">所有数据都存在你的本地浏览器里，不会上传到任何服务器。看看你走过的心理旅程。</p>
      </div>
    </section>

    <section style="margin-top:28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px">
      <div class="card" style="text-align:center;padding:24px">
        <div id="recCount" style="font-size:36px;font-weight:700;background:linear-gradient(135deg,#2DD4BF,#818CF8);-webkit-background-clip:text;-webkit-text-fill-color:transparent">0</div>
        <div style="font-size:12px;color:#94A3B8;margin-top:4px">累计测评次数</div>
      </div>
      <div class="card" style="text-align:center;padding:24px">
        <div id="recLatest" style="font-size:20px;font-weight:700;color:#F8FAFC">--</div>
        <div style="font-size:12px;color:#94A3B8;margin-top:4px">最近风险等级</div>
      </div>
      <div class="card" style="text-align:center;padding:24px">
        <div id="recDay" style="font-size:20px;font-weight:700;color:#F8FAFC">--</div>
        <div style="font-size:12px;color:#94A3B8;margin-top:4px">上次测评</div>
      </div>
    </section>

    <section style="margin-top:36px">
      <h3 style="color:#F8FAFC;font-size:16px;font-weight:700;margin-bottom:16px">📋 历史测评记录</h3>
      <div id="recordsList">
        <div class="card" style="text-align:center;padding:48px">
          <div style="font-size:48px;margin-bottom:12px">🔍</div>
          <div style="color:#F8FAFC;font-size:14px;font-weight:600;margin-bottom:8px">还没有测评记录</div>
          <div style="color:#94A3B8;font-size:13px;margin-bottom:20px">去做一次测评，开启你的心理旅程</div>
          <a href="/assessment" class="btn btn-primary">🚀 开始测评</a>
        </div>
      </div>
    </section>
  </div>

  <script>
  function loadRecords() {
    fetch('/api/features/my-records').then(r => r.json()).then(data => {
      if (!data.records || data.records.length === 0) return;
      const list = document.getElementById('recordsList');
      document.getElementById('recCount').textContent = data.records.length;
      const latest = data.records[0];
      document.getElementById('recLatest').textContent = latest.risk_level_cn || '--';
      document.getElementById('recDay').textContent = latest.created_at ? latest.created_at.slice(0,10) : '--';
      list.innerHTML = data.records.map(r => {
        const badges = {low:'🟢 低风险', medium:'🟡 中风险', high:'🟠 高风险', very_high:'🔴 极高风险'};
        return '<div class="card" style="padding:18px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center">'+
          '<div><div style="display:flex;gap:10px;align-items:center;margin-bottom:4px">'+
          '<span style="font-weight:600;color:#F8FAFC;font-size:14px">'+(badges[r.risk_level]||r.risk_level_cn||'测评')+'</span>'+
          '<span style="font-size:12px;color:#94A3B8">'+(r.created_at||'--')+'</span></div>'+
          '<div style="font-size:13px;color:#CBD5E1">综合 <strong style="color:#F8FAFC">'+(r.overall_score||'--')+'</strong> 分 · '+(r.total_answered||'--')+' 题</div></div></div>';
      }).join('');
    }).catch(() => {});
  }
  loadRecords();
  </script>

  <footer>MindGuard · 神经符号心理健康风险智能筛查系统</footer>
  <script src="/static/js/app.js?v=4.6"></script>
</body>
</html>
