<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="logo"><span class="logo-mark">🧠</span><span>MindGuard</span></div>
    <nav>
      <a href="/">首页</a>
      <a href="/assessment">测评中心</a>
      <a href="/my-records">我的档案</a>
      <a href="/resources">心理资源</a>
    </nav>
  </header>

  <div class="container">
    <section class="hero">
      <div class="hero-content">
        <div class="eyebrow">📝 每天 30 秒 · 心情打卡</div>
        <h1>坚持打卡，<br>看看你的心情节奏</h1>
        <p class="sub">连续打卡的话，下面的热力图会亮起来。<br>绿色代表状态好，红色代表需要关注。</p>
      </div>
    </section>

    <section style="margin-top:32px">
      <div class="card" style="padding:28px">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px">
          <div style="font-size:28px">🎨</div>
          <div style="font-size:16px;font-weight:600;color:#F8FAFC">今天心情怎么样？</div>
        </div>
        <div id="moodPicker" style="display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap">
          <button class="mood-btn" data-mood="5" style="font-size:28px;padding:12px 16px;border-radius:12px;border:2px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.02);cursor:pointer;transition:.2s">😄</button>
          <button class="mood-btn" data-mood="4" style="font-size:28px;padding:12px 16px;border-radius:12px;border:2px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.02);cursor:pointer;transition:.2s">🙂</button>
          <button class="mood-btn" data-mood="3" style="font-size:28px;padding:12px 16px;border-radius:12px;border:2px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.02);cursor:pointer;transition:.2s">😐</button>
          <button class="mood-btn" data-mood="2" style="font-size:28px;padding:12px 16px;border-radius:12px;border:2px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.02);cursor:pointer;transition:.2s">😔</button>
          <button class="mood-btn" data-mood="1" style="font-size:28px;padding:12px 16px;border-radius:12px;border:2px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.02);cursor:pointer;transition:.2s">😢</button>
        </div>
        <textarea id="moodNote" placeholder="一句话记录今天（可选，比如：\n"今天天气很好，考试也顺利"）" rows="2" style="font-size:14px;margin-bottom:16px"></textarea>
        <div style="display:flex;gap:12px;align-items:center">
          <button class="btn btn-primary" onclick="saveMood()">💾 保存打卡</button>
          <span id="streak" style="font-size:13px;color:#2DD4BF"></span>
        </div>
      </div>
    </section>

    <section style="margin-top:36px">
      <h3 style="color:#F8FAFC;font-size:16px;font-weight:700;margin-bottom:16px">📅 心情热力图（近 140 天）</h3>
      <div class="card" style="padding:24px;overflow-x:auto">
        <div id="heatmap" style="min-width:560px"></div>
      </div>
    </section>
  </div>

  <script>
  let selectedMood = null;
  document.querySelectorAll('.mood-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.mood-btn').forEach(b => {
        b.style.background = 'rgba(255,255,255,0.02)';
        b.style.borderColor = 'rgba(255,255,255,0.1)';
      });
      btn.style.background = 'rgba(45,212,191,0.2)';
      btn.style.borderColor = '#2DD4BF';
      selectedMood = parseInt(btn.dataset.mood);
    });
  });
  function saveMood() {
    if (!selectedMood) { alert('请先选择一个心情'); return; }
    fetch('/api/features/mood-journal', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({mood: selectedMood, note: document.getElementById('moodNote').value})
    }).then(r => r.json()).then(data => {
      alert('✅ 打卡成功！已坚持 ' + (data.streak || 0) + ' 天');
      loadHeatmap();
    }).catch(() => alert('打卡失败，请稍后重试'));
  }
  function loadHeatmap() {
    fetch('/api/features/mood-heatmap').then(r => r.json()).then(data => {
      const container = document.getElementById('heatmap');
      const streakEl = document.getElementById('streak');
      if (!data.records || data.records.length === 0) {
        container.innerHTML = '<div style="color:#94A3B8;text-align:center;padding:40px">暂暂无打卡数据，每天来打一次卡吧～</div>';
        return;
      }
      if (data.streak) streakEl.textContent = '🔥 已连续 ' + data.streak + ' 天';
      const today = new Date();
      const weeks = 20;
      const html = ['<div style="display:grid;grid-template-columns:repeat('+weeks+',14px);gap:3px;width:fit-content">'];
      const records = data.records || [];
      for (let w = weeks-1; w >= 0; w--) {
        for (let d = 6; d >= 0; d--) {
          const date = new Date(today); date.setDate(date.getDate() - w*7 - d);
          const key = date.toISOString().slice(0,10);
          const rec = records.find(r => r.date === key);
          const mood = rec ? rec.mood : 0;
          const colors = ['rgba(255,255,255,0.05)','rgba(239,68,68,0.4)','rgba(249,115,22,0.5)','rgba(251,191,36,0.55)','rgba(132,204,22,0.6)','rgba(45,212,191,0.7)'];
          const tooltips = ['','😢 很差','😔 较差','😐 一般','🙂 不错','😄 很好'];
          html.push('<div style="width:14px;height:14px;border-radius:3px;background:'+colors[mood]+';border:1px solid rgba(255,255,255,0.05)" title="'+key+' '+(tooltips[mood]||'')+'"></div>');
        }
      }
      html.push('</div>');
      container.innerHTML = html.join('');
    }).catch(() => {});
  }
  loadHeatmap();
  </script>

  <footer>MindGuard · 神经符号心理健康风险智能筛查系统</footer>
  <script src="/static/js/app.js"></script>
</body>
</html>
