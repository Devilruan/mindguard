<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>管理员登录 · MindGuard</title>
  <link rel="stylesheet" href="/static/css/app.css?v=4.6">
  <link rel="stylesheet" href="/static/css/vendor/bootstrap-icons.min.css?v=3.0">
  <link rel="icon" href="/favicon.ico">
</head>
<body class="login-page">
  <header class="topbar">
    <div class="logo">
      <span class="logo-mark">🧠</span>
      <span>MindGuard</span>
    </div>
    <nav>
      <a href="/">首页</a>
      <a href="/assessment">测评中心</a>
      <a href="/my-records">我的档案</a>
      <a href="/resources">心理资源</a>
    </nav>
  </header>

  <div class="login-box">
    <div class="login-logo">
      <div class="emoji">🧠</div>
      <h1>MindGuard 管理后台</h1>
      <p>神经符号心理健康风险筛查系统</p>
    </div>

    <div id="loginError" class="login-error"></div>

    <form id="loginForm" onsubmit="return handleLogin(event)">
      <div class="form-group">
        <label>用户名</label>
        <input type="text" id="username" autocomplete="username" required placeholder="默认: admin">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="password" autocomplete="current-password" required placeholder="默认: admin123">
      </div>
      <button type="submit" id="btnLogin" class="btn-login">登 录</button>
    </form>
  </div>
  <a href="/" class="back-link">← 返回首页</a>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btnLogin');
      const errBox = document.getElementById('loginError');

      errBox.classList.remove('show');
      btn.disabled = true;
      btn.textContent = '登录中...';

      fetch('/api/admin/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        credentials: 'include',
        body: JSON.stringify({username, password}),
      })
      .then(r => {
        if (r.ok) {
          window.location.href = '/admin';
        } else {
          return r.json().then(d => { throw new Error(d.detail || '登录失败'); });
        }
      })
      .catch(err => {
        errBox.textContent = err.message;
        errBox.classList.add('show');
        btn.disabled = false;
        btn.textContent = '登 录';
      });
      return false;
    }
  </script>
  <script src="/static/js/app.js?v=4.6"></script>
</body>
</html>
